<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Show Event</title>\
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <table border="3" class="table-borderless table table-striped table-hover">
        <thead>
            <tr>
                <th scope="col">ID</th>
                <th scope="col">Name</th>
                <th scope="col">Event Category</th>
                <th scope="col">Event Date</th>
                <th scope="col">Venue</th>
                <th scope="col">Image</th>
                <th colspan="2"></th>
            </tr>
        </thead>
        <tbody>
            {% for e in event %}
            <tr>
                <td>{{ e.id }}</td>
                <td>{{ e.name }}</td>
                <td>{{ e.event_categort }}</td>
                <td>{{ e.event_data }}</td>
                <td>{{ e.venue }}</td>
                <td>
                    {% if e.image %}
                    <img src="{{ e.image.url }}" alt="{{ e.name }}" width="100">
                    {% endif %}
                </td>
                {# <td><a href="{% url 'event:update_event' e.id %}"><button>Update</button></a></td> #}
                {# <td><a href="{% url 'event:delete_event' e.id %}"><button>Delete</button></a></td>#}
            </tr>
            {% endfor %}
        </tbody>
    </table>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
