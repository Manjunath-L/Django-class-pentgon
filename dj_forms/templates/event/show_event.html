<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Show Event</title>
</head>

<body>
    <table border="3">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Event Category</th>
                <th>Event Date</th>
                <th>Venue</th>
                <th>Image</th>
                <th colspan="2"></th>
            </tr>
        </thead>
        <tbody>
            {% for e in event %}
            <tr>
                <td>{{ e.id }}</td>
                <td>{{ e.name }}</td>
                <td>{{ e.event_categort }}</td>
                <td>{{ e.event_data }}</td>
                <td>{{ e.venue }}</td>
                <td>
                    {% if e.image %}
                    <img src="{{ e.image.url }}" alt="{{ e.name }}" width="100">
                    {% endif %}
                </td>
                {# <td><a href="{% url 'event:update_event' e.id %}"><button>Update</button></a></td> #}
                {# <td><a href="{% url 'event:delete_event' e.id %}"><button>Delete</button></a></td>#}
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>

</html>
