<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <table>
      <tr>
        <th>SID</th>
        <th>Name</th>
        <th>Std</th>
        <th>Gender</th>
      </tr>
      {% for student in students %}
      <tr>
        <td>{{ student.sid }}</td>
        <td>{{ student.name }}</td>
        <td>{{ student.std }}</td>
        <td>{{ student.gender }}</td>
      </tr>
      {% endfor %}
    </table>
  </body>
</html>
