{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{% static 'css/add_emp.css' %}" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update EMP</title>
    <style>
    </style>
</head>

<body>
    <form action="" method="post">
        {% csrf_token %}
        <label for="deptno">Dept No:</label>
        <input type="number" id="deptno" name="deptno" value="{{ employee.deptno }}" required><br><br>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" value="{{ employee.name }}" required><br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" value="{{ employee.email }}" required><br><br>
        <label for="date_of_join">Date of join:</label>
        <input type="date" id="date_of_join" name="date_of_join" value="{{ employee.date_of_join }}" required><br><br>
        <label for="age">Age:</label>
        <input type="number" id="age" name="age" value="{{ employee.age }}" required><br><br>
        <label for="salary">Salary:</label>
        <input type="number" id="salary" name="salary" value="{{ employee.salary }}" required><br><br>
        <label for="department">Department:</label>
        <input type="text" id="department" name="department" value="{{ employee.department }}" required><br><br>
        <input type="submit" value="Update Employee">
    </form>
</body>

</html>
