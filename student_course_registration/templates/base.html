{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Student Course Registration{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/student_course_registration.css' %}">
</head>

<body>
    <div class="app-shell">
        <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top">
            <div class="container py-2">
                <a class="navbar-brand fw-bold d-flex align-items-center gap-3" href="{% url 'student-list' %}">
                    <span class="badge bg-primary rounded">SC</span>
                    <span>Student Course Registration</span>
                </a>
                <div class="ms-auto d-flex gap-2 flex-wrap">
                    <a class="btn btn-outline-secondary btn-sm" href="{% url 'student-list' %}">Students</a>
                    <a class="btn btn-outline-secondary btn-sm" href="{% url 'student-create' %}">Add Student</a>
                    <a class="btn btn-primary btn-sm" href="{% url 'course-create' %}">Add Course</a>
                </div>
            </div>
        </nav>

        <main class="container py-4 py-lg-5">
            {% if messages %}
            <div class="mb-4">
                {% for message in messages %}
                <div
                    class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} shadow-sm">
                    {{ message }}
                </div>
                {% endfor %}
            </div>
            {% endif %}

            {% block content %}{% endblock %}
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
