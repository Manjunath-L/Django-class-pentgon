<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Doctor</title>
    <style>
        form {
            display: flex;
            flex-direction: column;
            width: 300px;
            border: 1px solid black;
        }

        input[type="text"],
        input[type="number"],
        input[type="file"] {
            margin-bottom: 10px;
            padding: 8px;
            font-size: 16px;
        }

        input[type="submit"] {
            padding: 10px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color: #45a049;
        }

        h1 {
            color: #10cf1c;
        }

        p {
            font-size: 18px;
            color: #10cf1c;
        }
    </style>
</head>

<body>
    <h1>Delete Doctor</h1>
    <form action="" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <p>Are you sure you want to delete this doctor?</p>
        <p>{{ doctor.doctor_name }}</p>
        <img src="{{ doctor.doctor_photo.url }}" alt="{{ doctor.doctor_name }}'s photo" width="200">
        <input type="submit" value="Delete Doctor">
    </form>

</body>

</html>
