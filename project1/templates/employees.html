<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Document</title>
    <style>
        table {
            width: 50%;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }
    </style>
</head>

<body>
    <table>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Age</th>
            <th>Department</th>
        </tr>
        {% for employee in employees %}
        <tr>
            <td>{{forloop.counter}}</td>
            <!-- <td>{{forloop.counter0}}</td> 0 n-1 -->
            <!-- <td>{{forloop.revcounter}}</td> n 1 -->
            <!-- <td>{{forloop.revcounter0}}</td> n 0 -->
            <td>{{ employee.name }}</td>
            <td>{{ employee.age }}</td>
            <td>{{ employee.department }}</td>
        </tr>
        {% endfor %}
    </table>
</body>

</html>
